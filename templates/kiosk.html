<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LHTPi - Präsentation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
#page{width:100%;height:100%;pointer-events:none}
#player{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#player img,#player video{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-drag:none}
#player video{width:100%;height:100%}
#empty{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-family:sans-serif;font-size:2rem;text-align:center;pointer-events:none}
/* Maus-Cursor-Overlay: deckt den HW-Cursor mit einem transparenten Bereich ab */
#cursor-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;pointer-events:none}
/* Google Translate-Overlay komplett unsichtbar machen */
iframe[src*="translate"], div[class*="translate"], div[id*="translate"], div[aria-label*="Translate"], .goog-te-banner-frame, .goog-te-menu-frame, .goog-te-gadget-simple, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;position:absolute!important;top:-9999px!important;left:-9999px!important;z-index:-1!important}
</style>
<script>
/* Kiosk-Mauszeiger: nach Inaktivität aus, bei Bewegung sofort wieder da.
   Identisch in allen Tools – Referenz: tools/kiosk-cursor.js */
(function () {
  var q = new URLSearchParams(location.search).get('cursor_idle');
  var n = parseInt(q || document.documentElement.dataset.cursorIdle || '3', 10);
  /* 0 = Zeiger nie ausblenden (Wartungsbetrieb der Anzeige) */
  var MS = (isNaN(n) ? 3 : n) * 1000;
  var timer;
  function hide() {
    if (!MS) return;
    if (document.getElementById('_kh')) return;
    var s = document.createElement('style');
    s.id = '_kh';
    s.textContent = '*,html,body{cursor:none!important}';
    document.head.appendChild(s);
  }
  function show() {
    var s = document.getElementById('_kh');
    if (s) s.remove();
    clearTimeout(timer);
    if (MS) timer = setTimeout(hide, MS);
  }
  ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart'].forEach(function (e) {
    document.addEventListener(e, show, true);
  });
  if (MS) timer = setTimeout(hide, MS);
})();

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('touchstart', e => {if(e.touches.length>1) e.preventDefault();}, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</head>
<body>
<div id="page">
<div id="cursor-overlay"></div>
<div id="empty">⏳ Warte auf Playlist…</div>
<div id="player"></div>
</div>

<script>
let items=[],currIdx=0,timer=null;
let playlistSignature='';

function makeSignature(d){
  return d.active ? JSON.stringify({
    playlist: d.playlist_name,
    source: d.source,
    items: (d.items||[]).map(i => [i.url, i.display_duration, i.filename])
  }) : '';
}

function playItem(idx){
const player=document.getElementById('player');
const em=document.getElementById('empty');
if(!items.length){
em.textContent='📋 Keine aktive Playlist';
em.style.display='block';player.innerHTML='';
return;
}
const item=items[idx % items.length];
currIdx=idx % items.length;
em.style.display='none';
player.innerHTML='';

if(item.file_type==='image'){
const img=document.createElement('img');
img.src=item.url||'/uploads/'+item.filename;
img.alt=item.original_name;
img.onerror=()=>{nextItem()};
player.appendChild(img);
timer=setTimeout(()=>nextItem(),(item.display_duration||10)*1000);
}else if(item.file_type==='video'){
const vid=document.createElement('video');
vid.src=item.url||'/uploads/'+item.filename;
vid.autoplay=true;
vid.muted=true;
vid.playsInline=true;
vid.onerror=()=>{nextItem()};
vid.onended=()=>nextItem();
vid.onloadedmetadata=()=>{
const dur=item.display_duration||0;
vid.play().catch(()=>{});
if(dur>0&&dur<vid.duration){
timer=setTimeout(()=>{vid.pause();nextItem();},dur*1000);
}
};
player.appendChild(vid);
}
}

function nextItem(){
clearTimeout(timer);
playItem(currIdx+1);
}

async function checkPlaylist(){
try{
const r=await fetch('/present/api/status');
const d=await r.json();
const nextSignature = makeSignature(d);
if(d.active && nextSignature !== playlistSignature){
  playlistSignature = nextSignature;
  items = d.items || [];
  currIdx = d.current_item_index || 0;
  clearTimeout(timer);
  playItem(currIdx);
}else if(!d.active){
  if(items.length || playlistSignature !== ''){
    playlistSignature = '';
    items=[];clearTimeout(timer);
    document.getElementById('player').innerHTML='';
  }
  const em=document.getElementById('empty');
  em.textContent='⏸️ '+(d.status||'Keine aktive Playlist');
  em.style.display='block';
}
}catch(e){}
}
checkPlaylist();
setInterval(checkPlaylist,5000);
</script>
</body>
</html>
