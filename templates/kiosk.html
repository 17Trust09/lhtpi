<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LHTPi - Präsentation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;cursor:none!important}
#page{width:100%;height:100%;pointer-events:none;cursor:none!important}
#player{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#player img,#player video{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-drag:none}
#player video{width:100%;height:100%}
#overlay{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:8px;font-family:sans-serif;font-size:14px;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
#overlay.show{opacity:1}
#empty{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-family:sans-serif;font-size:2rem;text-align:center;pointer-events:none}
/* Google Translate-Overlay komplett unsichtbar machen */
iframe[src*="translate"], div[class*="translate"], div[id*="translate"], div[aria-label*="Translate"], .goog-te-banner-frame, .goog-te-menu-frame, .goog-te-gadget-simple, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;position:absolute!important;top:-9999px!important;left:-9999px!important;z-index:-1!important}
</style>
<script>
// Maus-Overlay-Events sofort killen – bevor Chromium den Cursor zeigt
(function(){
  // Cursor alle 100ms aus dem Bildschirm werfen
  const hideCursor = () => {
    try {
      // Versuch 1: CSS per forceCursorNone
      const s = document.getElementById('_cursor_hide') || (()=>{
        const e=document.createElement('style');
        e.id='_cursor_hide';
        document.head.appendChild(e);
        return e;
      })();
      s.textContent = '*{cursor:none!important}html,body{cursor:none!important}';
      // Versuch 2: Maus per hiddenmousemove außerhalb treiben
      // (nicht möglich im Browser, aber wir blocken alle Events)
    } catch(e){}
  };
  hideCursor();
  setInterval(hideCursor, 1000);
  
  // Pointer-Events abfangen
  const block = e => { e.preventDefault(); e.stopPropagation(); };
  document.addEventListener('mousemove', block, true);
  document.addEventListener('mouseenter', block, true);
  document.addEventListener('mouseover', block, true);
  document.addEventListener('mouseout', block, true);
  document.addEventListener('pointermove', block, true);
  document.addEventListener('pointerover', block, true);
  document.addEventListener('pointerenter', block, true);
})();

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('touchstart', e => {if(e.touches.length>1) e.preventDefault();}, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</head>
<body>
<div id="page">
<div id="empty">⏳ Warte auf Playlist…</div>
<div id="player"></div>
<div id="overlay"></div>
</div>

<script>
let items=[],currIdx=0,timer=null,overlayTimer=null;
let playlistSignature='';

function makeSignature(d){
  return d.active ? JSON.stringify({
    playlist: d.playlist_name,
    items: (d.items||[]).map(i => [i.id, i.media_id, i.position, i.display_duration, i.filename])
  }) : '';
}

function showOverlay(msg){
const o=document.getElementById('overlay');
o.textContent=msg;o.classList.add('show');
clearTimeout(overlayTimer);
overlayTimer=setTimeout(()=>o.classList.remove('show'),3000);
}

function playItem(idx){
const player=document.getElementById('player');
const em=document.getElementById('empty');
if(!items.length){
em.textContent='📋 Keine aktive Playlist';
em.style.display='block';player.innerHTML='';
return;
}
const item=items[idx % items.length];
currIdx=idx % items.length;
em.style.display='none';
player.innerHTML='';

if(item.file_type==='image'){
const img=document.createElement('img');
img.src='/uploads/'+item.filename;
img.alt=item.original_name;
img.onerror=()=>{showOverlay('⚠️ Fehler beim Laden');nextItem()};
player.appendChild(img);
timer=setTimeout(()=>nextItem(),(item.display_duration||10)*1000);
showOverlay(`📷 ${item.original_name} — ${item.display_duration||10}s`);
}else if(item.file_type==='video'){
const vid=document.createElement('video');
vid.src='/uploads/'+item.filename;
vid.autoplay=true;
vid.muted=true;
vid.playsInline=true;
vid.onerror=()=>{showOverlay('⚠️ Fehler beim Laden');nextItem()};
vid.onended=()=>nextItem();
vid.onloadedmetadata=()=>{
const dur=item.display_duration||0;
showOverlay(`🎬 ${item.original_name} — ${dur===0?'Auto':`${dur}s`}`);vid.play().catch(()=>{});
if(dur>0&&dur<vid.duration){
timer=setTimeout(()=>{vid.pause();nextItem();},dur*1000);
}
};
player.appendChild(vid);
}
}

function nextItem(){
clearTimeout(timer);
playItem(currIdx+1);
}

async function checkPlaylist(){
try{
const r=await fetch('/present/api/status');
const d=await r.json();
const nextSignature = makeSignature(d);
if(d.active && nextSignature !== playlistSignature){
  playlistSignature = nextSignature;
  items = d.items || [];
  currIdx = d.current_item_index || 0;
  clearTimeout(timer);
  playItem(currIdx);
}else if(!d.active && items.length){
  playlistSignature = '';
  items=[];clearTimeout(timer);
  document.getElementById('empty').textContent='⏸️ Präsentation pausiert';
  document.getElementById('empty').style.display='block';
  document.getElementById('player').innerHTML='';
}
}catch(e){}
}
checkPlaylist();
setInterval(checkPlaylist,5000);
</script>
</body>
</html>
