<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anzeige – {{ cfg.name }}</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
  #stage{position:absolute;inset:0}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;
    opacity:0;transition:opacity .7s ease;pointer-events:none}
  .frame.on{opacity:1}
  {% if cfg.wartung_knopf %}
  /* Wartungsbetrieb: die eingebetteten Tools nehmen Eingaben an. Nur so sind
     ihre eigenen Seiten bedienbar - z. B. der Reiter „Admin" im Safety Cross.
     Der Wartungs-Knopf bleibt deshalb dauerhaft sichtbar: ueber einem
     bedienbaren Rahmen bekaeme diese Seite keine Mausbewegung mehr mit. */
  .frame.on{pointer-events:auto}
  {% else %}
  /* Nur Anzeige: die eingebetteten Tools nehmen keine Eingaben an. Wuerden sie
     klicken lassen, bekaeme diese Seite keine Mausbewegung mehr - der
     Wartungs-Knopf waere nicht erreichbar. Die Verwaltung laeuft ueber den
     Knopf (eigener Rahmen, siehe #einst). */
  {% endif %}
  #einst{pointer-events:auto}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#8a93a3;font-family:Inter,Arial,sans-serif;font-size:2rem;text-align:center;
    line-height:1.5}
  {% if cfg.wartung_knopf %}
  /* Wartungsbetrieb: die eingebetteten Tools nehmen Eingaben an. Nur so sind
     ihre eigenen Seiten bedienbar - z. B. der Reiter "Admin" im Safety Cross.
     Der Knopf schwebt darueber und erscheint beim Laden und bei Mausbewegung
     im Tool (das Tool meldet sie per postMessage). Kein Balken, die Anzeige
     bleibt im Vollbild. */
  .frame.on{pointer-events:auto}
  #wartung{position:fixed;left:.8rem;bottom:.6rem;z-index:2147483647;
    transform:translateZ(0);will-change:transform;display:flex;gap:.5rem}
  #wartung[hidden]{display:none}
  {% endif %}
  #wartung a,#wartung button{display:inline-block;padding:.45rem .95rem;
    border-radius:999px;background:rgba(5,22,77,.85);color:#fff;
    text-decoration:none;font:600 .95rem Inter,Arial,sans-serif;
    border:1px solid rgba(255,255,255,.28)}
  #wartung button{appearance:none;-webkit-appearance:none}
  #wartung button[data-ziel]{background:rgba(74,20,26,.92)}
  #badge{position:fixed;right:.8rem;bottom:.6rem;z-index:10;padding:.2rem .6rem;
    border-radius:999px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);
    font:600 .8rem Inter,Arial,sans-serif;letter-spacing:.03em}
  #einst{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:40;display:none}
  #einst.on{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint" hidden></div>
<div id="badge" hidden></div>
{% if cfg.wartung_knopf %}<div id="wartung"><a href="{{ url_for('display') }}">⚙ Anzeigen</a>
<button type="button" data-ziel="/system/neustart" data-ruhe="⟳ Neustart" data-frage="Wirklich neu starten?">⟳ Neustart</button>
<button type="button" data-ziel="/system/herunterfahren" data-ruhe="⏻ Herunterfahren" data-frage="Wirklich herunterfahren?">⏻ Herunterfahren</button>
</div>
<iframe id="einst" src="{{ url_for('display') }}" title="Anzeigen-Einstellungen"></iframe>
<script>
/* „Anzeigen" oeffnet die Einstellungen IM Kiosk-Fenster. Ein echter
   Fensterwechsel wuerde den Kiosk-Modus beenden - Chromium zeigt dann wieder
   Leiste und Reiter. Die Einstellungs-Seite meldet sich per postMessage
   zurueck, wenn sie fertig ist. */
(function () {
  var knopf = document.getElementById('wartung');
  var einst = document.getElementById('einst');
  if (!knopf || !einst) return;
  var link = knopf.querySelector('a');
  function auf() {
    /* Der eigene Klick der Anzeige darf das Einstellungsfenster nicht oeffnen. */
    if (window.__lhtpiEigenerKlick && window.__lhtpiEigenerKlick()) return;
    einst.classList.add('on'); knopf.hidden = true;
    window.__lhtpiWartungOffen = true;
  }
  function zu() {
    window.__lhtpiWartungOffen = false;
    einst.classList.remove('on');
    knopf.hidden = false;                 /* Knopf wieder einblenden */
    var fs = document.querySelectorAll('iframe.frame');
    for (var i = 0; i < fs.length; i++) fs[i].src = fs[i].src;   /* neu laden */
  }
  if (link) link.addEventListener('click', function (e) { e.preventDefault(); auf(); });
  /* Neustart / Herunterfahren: erst nachfragen, dann ausfuehren. */
  var sysknoepfe = knopf.querySelectorAll('button[data-ziel]');
  for (var si = 0; si < sysknoepfe.length; si++) {
    (function (b) {
      var zurueck = null;
      b.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (window.__lhtpiZeigenKnopf) window.__lhtpiZeigenKnopf();
        if (b.dataset.bereit !== '1') {            /* erster Druck: fragen */
          b.dataset.bereit = '1';
          b.textContent = b.dataset.frage;
          clearTimeout(zurueck);
          zurueck = setTimeout(function () {
            b.dataset.bereit = '';
            b.textContent = b.dataset.ruhe;
          }, 8000);
          return;
        }
        b.textContent = 'läuft …';                 /* zweiter Druck: ausführen */
        b.disabled = true;
        /* Rückmeldung anzeigen - sonst steht hier ewig "läuft …" */
        var zuruecksetzen = function () {
          b.dataset.bereit = '';
          b.disabled = false;
          b.textContent = b.dataset.ruhe;
        };
        b.dataset.bereit = '';
        fetch(b.dataset.ziel, { method: 'POST' }).then(function (r) {
          if (r.ok) { b.textContent = 'gleich …'; return; }
          b.textContent = 'ging nicht';
          clearTimeout(zurueck);
          zurueck = setTimeout(zuruecksetzen, 5000);
        }).catch(function () {
          b.textContent = 'ging nicht';
          clearTimeout(zurueck);
          zurueck = setTimeout(zuruecksetzen, 5000);
        });
      });
    })(sysknoepfe[si]);
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.lhtpi === 'zurueck') zu();
  });
})();
</script>{% endif %}

<script id="cfg" type="application/json">{{ cfg|tojson }}</script>
<script>
/* ── Wartungs-Knopf: im Wartungsbetrieb dauerhaft sichtbar ───────────────── */
/* Ueber einem bedienbaren Tool-Rahmen bekommt diese Seite keine Mausbewegung
   mehr mit - der Knopf muss also sichtbar bleiben, sonst waere er unerreichbar. */
(function () {
  var knopf = document.getElementById('wartung');
  var cfgW = JSON.parse(document.getElementById('cfg').textContent);
  if (!knopf || !cfgW.wartung_knopf) return;
  var timer = null;
  function zeigen() {
    knopf.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(function () { knopf.hidden = true; }, 6000);
  }
  /* Das Tool meldet jede Mausbewegung: ueber einem bedienbaren Rahmen bekommt
     diese Seite selbst keine Bewegung mehr mit. Der Knopf kommt dann zurueck.
     (Kein Origin-Vergleich - die Tools laufen auf eigenen Ports.) */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.lhtpi === 'maus') zeigen();
  });
  window.__lhtpiZeigenKnopf = zeigen;      /* fuer die Systemknoepfe */
  knopf.hidden = false;                    /* beim Laden kurz sichtbar */
  timer = setTimeout(function () { knopf.hidden = true; }, 12000);
})();

/* ── Mauszeiger: nach Inaktivität aus, bei Bewegung wieder da ─────────────── */
(function () {
  var MS = {{ (cfg.cursor_idle or 3) * 1000 }}, timer, eigenKlick = 0;
  /* Chromium zeichnet den Mauszeiger erst beim naechsten Mausereignis neu.
     Steht die Maus still, bleibt der Zeiger trotz Ausblenden sichtbar - bis
     jemand klickt. Deshalb loest die Anzeige nach der Ruhezeit selbst einen
     Klick am X-Server aus (POST /zeiger/klick). Der eigene Klick wird
     verworfen: er soll weder den Zeiger wieder einblenden noch die Wartung
     oeffnen. */
  function eigenerKlick() { return Date.now() - eigenKlick < 800; }
  window.__lhtpiEigenerKlick = eigenerKlick;
  function hide() {
    if (!MS) return;
    /* Im Einstellungsfenster bleibt der Zeiger sichtbar. */
    if (window.__lhtpiWartungOffen) { timer = setTimeout(hide, MS); return; }
    if (!document.getElementById('_kh')) {
      var s = document.createElement('style');
      s.id = '_kh';
      s.textContent = '*,html,body{cursor:none!important}';
      document.head.appendChild(s);
    }
    eigenKlick = Date.now();
    /* Der Klick darf nie ein Bedienelement im Tool treffen (im Wartungsbetrieb
       nimmt der Rahmen Eingaben an): kurz die Eingaben abschalten, klicken,
       danach wieder freigeben. */
    var fs = document.querySelectorAll('iframe.frame.on');
    for (var i = 0; i < fs.length; i++) fs[i].style.pointerEvents = 'none';
    try { fetch('/zeiger/klick', { method: 'POST' }); } catch (e) {}
    setTimeout(function () {
      for (var j = 0; j < fs.length; j++) fs[j].style.pointerEvents = '';
    }, 900);
  }
  function show() {
    if (eigenerKlick()) return;
    var s = document.getElementById('_kh');
    if (s) s.remove();
    clearTimeout(timer);
    if (MS) timer = setTimeout(hide, MS);
  }
  ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart'].forEach(function (e) {
    document.addEventListener(e, show, true);
  });
  if (MS) timer = setTimeout(hide, MS);
})();

/* ── Anzeige-Router: Tools fest oder rotierend ────────────────────────────── */
(function () {
  var cfg = JSON.parse(document.getElementById('cfg').textContent);
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  var badge = document.getElementById('badge');
  var tools = cfg.tools || [];
  var reloadMs = (cfg.reload_minutes || 30) * 60000;
  var frames = {}, loaded = {}, current = 0, timer = null;

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  if (!tools.length) {
    hint.hidden = false;
    // statischer Text (keine Nutzereingaben) – daher unkritisch
    hint.innerHTML = 'Kein Tool aktiv<br><span style="font-size:1rem">' +
      'Bitte in der Verwaltung unter „Anzeigen" einstellen.</span>';
    return;
  }

  // Alle Tools vorab laden (kein Flackern beim Wechsel)
  tools.forEach(function (t) {
    var f = document.createElement('iframe');
    f.className = 'frame';
    f.dataset.tool = t.tool;
    f.setAttribute('allow', 'autoplay');
    // Scrollen im Rahmen nur, wenn Wartung erlaubt ist: die Anzeige selbst
    // braucht kein Scrollen, die Verwaltung der Tools aber schon.
    f.setAttribute('scrolling', cfg.wartung_knopf ? 'auto' : 'no');
    f.src = t.url;
    stage.appendChild(f);
    frames[t.tool] = f;
    loaded[t.tool] = Date.now();
  });

  function show(i) {
    tools.forEach(function (t, k) {
      var f = frames[t.tool];
      if (!f) return;
      // abgelaufene Frames beim Aktivieren frisch laden
      if (k === i && Date.now() - (loaded[t.tool] || 0) > reloadMs) {
        f.src = t.url;
        loaded[t.tool] = Date.now();
      }
      f.classList.toggle('on', k === i);
    });
    if (cfg.vorschau) {
      // Vorschau aus der Verwaltung: immer anzeigen, welches Tool läuft
      badge.hidden = false;
      badge.textContent = 'Vorschau · ' + tools[i].short +
        (tools.length > 1 ? ' (' + (i + 1) + '/' + tools.length + ')' : ' (fest)');
    } else if (tools.length > 1) {
      badge.hidden = false;
      badge.textContent = (i + 1) + '/' + tools.length + ' · ' + tools[i].short;
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      current = (current + 1) % tools.length;
      show(current);
      schedule();
    }, Math.max(1, tools[current].dwell) * 1000);
  }

  show(0);
  if (tools.length > 1) schedule();   // 1 Tool = fest, kein Timer

  // Änderungen in der Verwaltung ohne Chromium-Neustart übernehmen
  setInterval(function () {
    fetch('/api/screen/' + cfg.idx, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.tools) return;
        var a = d.tools.map(function (t) { return t.tool + ':' + t.dwell; }).join(',');
        var b = tools.map(function (t) { return t.tool + ':' + t.dwell; }).join(',');
        if (a !== b) location.reload();
      })
      .catch(function () {});
  }, 60000);
})();
</script>
</body>
</html>
